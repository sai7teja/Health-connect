steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --cache-from
      - gcr.io/$PROJECT_ID/health-chat:latest
      - -t
      - gcr.io/$PROJECT_ID/health-chat:latest
      - -t
      - gcr.io/$PROJECT_ID/health-chat:$SHORT_SHA
      - .
    dir: services/health-chat

  - name: gcr.io/cloud-builders/docker
    args: [push, gcr.io/$PROJECT_ID/health-chat:latest]

  - name: gcr.io/cloud-builders/docker
    args: [push, gcr.io/$PROJECT_ID/health-chat:$SHORT_SHA]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - health-chat
      - --image=gcr.io/$PROJECT_ID/health-chat:$SHORT_SHA
      - --region=us-central1
      - --platform=managed
      - --no-allow-unauthenticated
      - --service-account=health-pipeline-sa@$PROJECT_ID.iam.gserviceaccount.com
      - --memory=512Mi
      - --cpu=1
      - --timeout=120
      - --set-env-vars=PROJECT_ID=$PROJECT_ID,GEMINI_API_KEY=$$GEMINI_API_KEY
      - --set-secrets=GEMINI_API_KEY=gemini-api-key:latest

images:
  - gcr.io/$PROJECT_ID/health-chat:latest
  - gcr.io/$PROJECT_ID/health-chat:$SHORT_SHA
